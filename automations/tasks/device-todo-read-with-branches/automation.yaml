- if:
  - condition: template
    value_template: '{{ variable_20 not in variable_19 }}'
  then:
  - action: script.example_01
    data:
      field_01: REPLACE_WITH_YOUR_OWN_TEXT
      field_02: '{{ variable_20 }}'
- action: notify.example_01
  metadata: {}
  data:
    title: 📦 Paket vor person Haustür erkannt
- action: notify.example_02
  metadata: {}
  data:
    title: 📦 Paket vor person Haustür erkannt
mode: single
