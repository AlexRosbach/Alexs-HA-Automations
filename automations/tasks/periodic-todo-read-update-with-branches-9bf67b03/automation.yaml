triggers:
- hours: /1
  trigger: time_pattern
actions:
- data:
    entity_id: todo.example_01
    status: needs_action
  response_variable: variable_21
  action: todo.get_items
- variables:
    variable_01: "{{ states\n  | selectattr('attributes.device_class', 'equalto',\
      \ 'battery')\n  | map(attribute='variable_03') | list }}"
    variable_09: "{{ expand(variable_01)\n  | selectattr('state', 'in', ['unavailable',\
      \ 'unknown'])\n  | map(attribute='variable_03') | list }}"
- repeat:
    for_each: '{{ variable_01 }}'
    sequence:
    - variables:
        variable_03: ENTITY_23
        variable_12: '{{ state_attr(variable_03, ''friendly_name'') }}'
        variable_22: '{{ variable_13(variable_03) or ''Unbekannt'' }}'
        variable_14: 'Offline: {{ variable_12 }} ({{ variable_22 }})'
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ repeat.item in variable_09 and\n   (variable_14 not\
            \ in (variable_21['todo.example_01']['items'] | map(attribute='variable_15')\
            \ | list)) }}"
        sequence:
        - action: script.example_01
          data:
            field_01: REPLACE_WITH_YOUR_OWN_TEXT
            field_02: '{{ variable_14 }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ repeat.item not in variable_09 }}'
        sequence:
        - variables:
            variable_23: "{{ variable_21['todo.example_01']['items']\n   | selectattr('variable_15',\
              \ 'equalto', variable_14)\n   | selectattr('status', 'equalto', 'needs_action')\n\
              \   | list | first }}"
        - if:
          - condition: template
            value_template: '{{ variable_23 is defined and variable_23 }}'
          then:
          - data:
              entity_id: todo.example_01
              item: '{{ variable_23.uid }}'
              status: completed
            action: todo.update_item
mode: single
alias: 'Task list: read tasks, update tasks — repeating schedule · with branches (9bf67b03)'
description: Public template using script.custom_action, todo.get_items, todo.update_item.
  Configure all placeholders and restore missing trigger or template details before
  use.
