triggers:
- trigger: state
  entity_id: vacuum.example_01
  to: person
- trigger: state
  entity_id: event.example_06
conditions:
- condition: template
  value_template: "{{\n  trigger.entity_id == 'vacuum.example_01'\n  or state_attr('event.example_06',\
    \ 'event_type') == 'finished_with_warnings'\n}}\n"
actions:
- action: notify.notify
  data:
    message: 'person person person braucht Aufmerksamkeit. Status: {{ states(''vacuum.example_01'')
      }}, person person: {{ state_attr(''event.example_06'', ''event_type'') }}

      '
    data:
      field_03: REPLACE_WITH_YOUR_OWN_TEXT
- action: todo.get_items
  target:
    entity_id: todo.example_01
  data:
    status: needs_action
  response_variable: variable_18
- variables:
    variable_19: '{{ variable_18[''todo.example_01''][''items''] | map(attribute=''variable_15'')
      | list }}'
    variable_20: 'person person person prüfen: Status {{ states(''vacuum.example_01'')
      }}, person person {{ state_attr(''event.example_06'', ''event_type'') }}

      '
- if:
  - condition: template
    value_template: '{{ variable_20 not in variable_19 }}'
  then:
  - action: script.example_01
    data:
      field_01: REPLACE_WITH_YOUR_OWN_TEXT
      field_02: '{{ variable_20 }}'
mode: single
alias: 'Task list: read tasks — state change · with branches (2eb2b24e)'
description: Public template using notify.notify, script.custom_action, todo.get_items.
  Configure all placeholders and restore missing trigger or template details before
  use.
