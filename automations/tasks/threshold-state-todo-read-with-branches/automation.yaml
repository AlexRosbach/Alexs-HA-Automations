triggers:
- id: IDENTIFIER_103
  entity_id: sensor.example_01
  above: 10
  for:
    minutes: 2
  trigger: numeric_state
- id: IDENTIFIER_104
  entity_id: sensor.example_01
  below: 5
  for:
    minutes: 20
  trigger: numeric_state
- id: IDENTIFIER_105
  entity_id: switch.example_13
  to: 'off'
  for:
    minutes: 1
  trigger: state
conditions: []
actions:
- choose:
  - alias: Waschmaschine wurde IDENTIFIER_103
    conditions:
    - condition: trigger
      id: IDENTIFIER_103
    sequence:
    - target:
        entity_id: input_boolean.example_10
      action: input_boolean.turn_on
  - alias: Waschmaschine ist IDENTIFIER_104
    conditions:
    - condition: trigger
      id:
      - IDENTIFIER_104
      - IDENTIFIER_105
    - condition: state
      entity_id: input_boolean.example_10
      state: 'on'
    sequence:
    - target:
        entity_id: input_boolean.example_10
      action: input_boolean.turn_off
    - data:
        title: Waschmaschine
        message: Die Waschmaschine ist IDENTIFIER_104.
      action: notify.example_01
    - data:
        title: Waschmaschine
        message: Die Waschmaschine ist IDENTIFIER_104.
      action: notify.example_02
    - target:
        entity_id: todo.example_01
      data:
        status: needs_action
      response_variable: variable_36
      action: todo.get_items
    - variables:
        variable_37: "{{ variable_36['todo.example_01']['items']\n   | map(attribute='variable_15')\n\
          \   | list }}"
    - if:
      - condition: template
        value_template: '{{ ''Waschmaschine ausraeumen'' not in variable_37 }}'
      then:
      - action: script.example_01
        data:
          field_01: REPLACE_WITH_YOUR_OWN_TEXT
          field_02: REPLACE_WITH_YOUR_OWN_TEXT
mode: single
alias: 'Task list: read tasks — numeric threshold, state change · with branches'
description: Public template using input_boolean.turn_off, input_boolean.turn_on,
  notify.custom_action, script.custom_action, todo.get_items. Configure all placeholders
  and restore missing trigger or template details before use.
