triggers:
- hours: /1
  trigger: time_pattern
actions:
- data:
    entity_id: todo.example_01
  response_variable: current_tasks
  action: todo.get_items
- variables:
    variable_01: '{{ states | selectattr(''attributes.device_class'', ''equalto'',
      ''battery'') | list }}'
    variable_02: "{{ (current_tasks['todo.example_01']['items'] | map(attribute='variable_15')\
      \ | list)\n   if current_tasks is defined else [] }}"
- repeat:
    for_each: '{{ variable_01 }}'
    sequence:
    - variables:
        variable_03: ENTITY_01
        variable_04: '{{ states(variable_03) }}'
        level: "{% if variable_04 in ['unknown','unavailable','None','none','', None]\
          \ %}\n  0\n{% else %}\n  {{ variable_04 | int(0) }}\n{% endif %}\n"
        variable_05: '{{ state_attr(variable_03, ''friendly_name'') }}'
        variable_06: '{{ variable_13(variable_03) or ''Unbekannt'' }}'
        variable_07: 'Batterie leer: {{ variable_05 }} ({{ variable_06 }})'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ level < 10 and variable_07 not in variable_02 }}'
        sequence:
        - action: script.example_01
          data:
            field_01: REPLACE_WITH_YOUR_OWN_TEXT
            field_02: '{{ variable_07 }}'
      - conditions:
        - condition: template
          value_template: '{{ level >= 10 and variable_07 in variable_02 }}'
        sequence:
        - variables:
            variable_08: "{{ current_tasks['todo.example_01']['items']\n   | selectattr('variable_15','equalto',variable_07)\n\
              \   | selectattr('status','equalto','needs_action')\n   | list | first\
              \ }}"
        - if:
          - condition: template
            value_template: '{{ variable_08 is defined and variable_08 }}'
          then:
          - data:
              entity_id: todo.example_01
              uid: '{{ variable_08.uid }}'
              status: completed
            action: todo.update_item
mode: single
alias: 'Task list: read tasks, update tasks — repeating schedule · with branches (b915c5b1)'
description: Public template using script.custom_action, todo.get_items, todo.update_item.
  Configure all placeholders and restore missing trigger or template details before
  use.
