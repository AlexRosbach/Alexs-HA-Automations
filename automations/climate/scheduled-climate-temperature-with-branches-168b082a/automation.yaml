triggers:
- trigger: time
  at: 06:45:00
conditions:
- condition: time
  weekday:
  - mon
  - tue
  - wed
  - thu
  - fri
- condition: state
  entity_id: person.example_02
  state: home
- condition: state
  entity_id: sensor.example_22
  state: IDENTIFIER_114
  for: 00:10:00
- condition: template
  value_template: '{{ states(''input_text.example_02'') != now().date()|string }}'
- condition: template
  value_template: '{{ not is_state(''calendar.example_01'',''IDENTIFIER_160'') }}'
actions:
- action: input_text.set_value
  target:
    entity_id: input_text.example_01
  data:
    value: '{{ now().date() }}'
- if:
  - condition: state
    entity_id: binary_sensor.example_15
    state: 'off'
  - condition: template
    value_template: '{{ states(''climate.example_04'') in [''auto'',''heat''] and
      state_attr(''climate.example_04'',''temperature'') is number }}'
  - condition: template
    value_template: '{{ states(''input_text.example_03'') == '''' }}'
  then:
  - action: input_text.set_value
    target:
      entity_id: input_text.example_04
    data:
      value: '{{ states(''climate.example_04'') }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.example_01
    data:
      value: '{{ state_attr(''climate.example_04'',''temperature'') }}'
  - action: climate.set_temperature
    target:
      entity_id: climate.example_04
    data:
      temperature: 21
      hvac_mode: heat
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.example_14
mode: single
alias: 'Climate: temperature — scheduled time · with branches (168b082a)'
description: Public template using climate.set_temperature, input_boolean.turn_on,
  input_number.set_value, input_text.set_value. Configure all placeholders and restore
  missing trigger or template details before use.
