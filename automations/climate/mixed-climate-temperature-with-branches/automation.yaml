triggers:
- trigger: time
  at: '18:00:00'
- trigger: homeassistant
  event: start
- trigger: state
  entity_id: input_text.example_03
  to: ''
- trigger: time_pattern
  minutes: /5
conditions:
- condition: template
  value_template: '{{ now().hour>=18 or states(''input_text.example_01'') != now().date()|string
    }}'
actions:
- condition: template
  value_template: '{{ states(''input_text.example_03'') == '''' }}'
- if:
  - condition: state
    entity_id: input_boolean.example_14
    state: 'on'
  - condition: state
    entity_id: climate.example_04
    state: heat
  - condition: template
    value_template: '{{ state_attr(''climate.example_04'',''temperature'')|float(0)==21
      and states(''input_text.example_04'') in [''auto'',''heat''] }}'
  then:
  - action: climate.set_temperature
    target:
      entity_id: climate.example_04
    data:
      temperature: '{{ states(''input_number.example_01'')|float(18) }}'
      hvac_mode: '{{ states(''input_text.example_04'') }}'
- action: input_boolean.turn_off
  target:
    entity_id: input_boolean.example_14
mode: single
alias: 'Climate: temperature — home assistant event, state change, scheduled time,
  repeating schedule · with branches'
description: Public template using climate.set_temperature, input_boolean.turn_off.
  Configure all placeholders and restore missing trigger or template details before
  use.
