triggers:
- trigger: time_pattern
  minutes: '0'
conditions:
- condition: template
  value_template: '{{ states(''sensor.example_16'') | float(0) >= 26.5 }}'
actions:
- variables:
    variable_40: '{{ states(''sensor.example_16'') | float(0) | round(1) }}'
    variable_41: '{{ states(''sensor.example_17'') | float(0) | round(1) }}'
    variable_27: '{{ states(''sensor.example_04'') | float(0) | round(1) }}'
    variable_42: '{{ (states(''sensor.example_04'') | float(99)) <= ((states(''sensor.example_16'')
      | float(0)) - 2) }}'
    variable_43: '{% if (states(''sensor.example_04'') | float(99)) <= ((states(''sensor.example_16'')
      | float(0)) - 2) %}Draußen ist es mindestens 2 °C kühler: Lüften ist sinnvoll.{%
      else %}Draußen ist es nicht deutlich kühler: Fenster eher geschlossen halten
      person Lüfter nutzen.{% endif %}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ 8 <= now().hour < 18 }}'
    - condition: state
      entity_id: fan.example_01
      state: 'off'
    sequence:
    - action: fan.turn_on
      target:
        entity_id: fan.example_01
    - action: fan.set_percentage
      target:
        entity_id: fan.example_01
      data:
        percentage: 75
    - action: notify.example_01
      data:
        title: Schlafzimmer zu warm
        message: '{{ variable_40 }} °C im Schlafzimmer (Thermostat {{ variable_41
          }} °C). Luefter wurde eingeschaltet. {{ variable_43 }}'
        data:
          tag: schlafzimmer_hitze
    - action: notify.example_02
      data:
        title: Schlafzimmer zu warm
        message: '{{ variable_40 }} °C im Schlafzimmer (Thermostat {{ variable_41
          }} °C). Luefter wurde eingeschaltet. {{ variable_43 }}'
        data:
          tag: schlafzimmer_hitze
  - conditions:
    - condition: template
      value_template: '{{ now().hour >= 18 or now().hour < 8 }}'
    - condition: state
      entity_id: fan.example_01
      state: 'off'
    sequence:
    - action: notify.example_01
      data:
        title: Schlafzimmer zu warm
        message: '{{ variable_40 }} °C im Schlafzimmer (Thermostat {{ variable_41
          }} °C). Luefter einschalten? {{ variable_43 }}'
        data:
          tag: schlafzimmer_luefter_rueckfrage
          actions:
          - action: entity.example_13
            title: Ja, einschalten
          - action: entity.example_14
            title: Nein
    - action: notify.example_02
      data:
        title: Schlafzimmer zu warm
        message: '{{ variable_40 }} °C im Schlafzimmer (Thermostat {{ variable_41
          }} °C). Luefter einschalten? {{ variable_43 }}'
        data:
          tag: schlafzimmer_luefter_rueckfrage
          actions:
          - action: entity.example_13
            title: Ja, einschalten
          - action: entity.example_14
            title: Nein
mode: single
alias: 'Fan: on, speed — repeating schedule · with branches'
description: Public template using fan.set_percentage, fan.turn_on, generic.action,
  notify.custom_action. Configure all placeholders and restore missing trigger or
  template details before use.
