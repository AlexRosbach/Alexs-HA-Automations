triggers:
- trigger: state
  entity_id: vacuum.example_06
  to: cleaning
  id: IDENTIFIER_113
- trigger: state
  entity_id: vacuum.example_05
  to: cleaning
  id: IDENTIFIER_114
- trigger: state
  entity_id: vacuum.example_02
  to: cleaning
  id: IDENTIFIER_115
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: IDENTIFIER_113
    sequence:
    - variables:
        previous_fan_state: '{{ states(''fan.example_02'') }}'
        previous_fan_preset: '{{ state_attr(''fan.example_02'', ''preset_mode'') }}'
    - action: fan.turn_on
      target:
        entity_id: fan.example_02
      data: {}
    - action: fan.set_preset_mode
      target:
        entity_id: fan.example_02
      data:
        preset_mode: turbo
    - parallel:
      - sequence:
        - action: notify.example_01
          data:
            title: person Turbo
            message: 'Büro: Roboter läuft, person ist bis person Ende person Reinigung
              auf Turbo.'
            data:
              tag: roboter_luftreiniger_buro
              actions:
              - action: entity.example_15
                title: person nicht steuern
      - sequence:
        - action: notify.example_02
          data:
            title: person Turbo
            message: 'Büro: Roboter läuft, person ist bis person Ende person Reinigung
              auf Turbo.'
            data:
              tag: roboter_luftreiniger_buro
              actions:
              - action: entity.example_15
                title: person nicht steuern
    - wait_for_trigger:
      - trigger: state
        entity_id: vacuum.example_06
        from: cleaning
      - trigger: state
        entity_id: vacuum.example_06
        from: returning
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: entity.example_15
      timeout: 04:00:00
      continue_on_timeout: true
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ wait.trigger is not none and wait.trigger.platform ==
            ''event'' }}'
        sequence:
        - action: notify.notify
          data:
            title: person-Steuerung gestoppt
            message: 'Büro: person-Automatik für diese Roboter-Reinigung wurde abgebrochen.'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ previous_fan_state == ''IDENTIFIER_159'' }}'
        sequence:
        - action: fan.turn_off
          target:
            entity_id: fan.example_02
          data: {}
      - conditions:
        - condition: template
          value_template: '{{ previous_fan_preset not in [none, ''unknown'', ''unavailable'',
            ''''] }}'
        sequence:
        - action: fan.set_preset_mode
          target:
            entity_id: fan.example_02
          data:
            preset_mode: '{{ previous_fan_preset }}'
      default:
      - action: fan.set_preset_mode
        target:
          entity_id: fan.example_02
        data:
          preset_mode: auto
