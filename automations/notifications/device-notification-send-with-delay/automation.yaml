mode: single
trigger:
- type: REPLACE_WITH_YOUR_OWN_TEXT
  device_id: DEVICE_05
  entity_id: ENTITY_05
  domain: REPLACE_WITH_YOUR_OWN_TEXT
  trigger: REPLACE_WITH_YOUR_OWN_TEXT
  below: 5
action:
- repeat:
    sequence:
    - action: notify.notify
      metadata: {}
      data:
        message: REPLACE_WITH_YOUR_OWN_TEXT
    - delay:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
    until:
    - type: REPLACE_WITH_YOUR_OWN_TEXT
      condition: REPLACE_WITH_YOUR_OWN_TEXT
      device_id: DEVICE_05
      entity_id: ENTITY_05
      domain: REPLACE_WITH_YOUR_OWN_TEXT
      above: 25
condition: []
alias: 'Notification: send — device trigger · with delay'
description: Public template using notify.notify. Configure all placeholders and restore
  missing trigger or template details before use.
