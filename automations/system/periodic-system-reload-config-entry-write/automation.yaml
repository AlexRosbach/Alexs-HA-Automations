triggers:
- minutes: /10
  trigger: time_pattern
conditions:
- condition: template
  value_template: "{% set s = states.sensor.example_09 %} {{ s is not none\n   and\
    \ s.last_updated is not none\n   and (as_timestamp(now()) - as_timestamp(s.last_updated))\
    \ > 1800 }}\n"
actions:
- data:
    level: warning
    message: 'person Realtime hängt, lade Integration person. Letztes Update person
      sensor.example_09: {{ states.sensor.example_09.last_updated }}

      '
  action: system_log.write
- data:
    entry_id: IDENTIFIER_93
  action: homeassistant.reload_config_entry
mode: single
alias: System and scripts control — repeating schedule
description: Public template using homeassistant.reload_config_entry, system_log.write.
  Configure all placeholders and restore missing trigger or template details before
  use.
