triggers:
- trigger: REPLACE_WITH_YOUR_OWN_TEXT
  target:
    entity_id: event.example_01
  options:
    event_type:
    - multi_press_1
conditions: []
actions:
- if:
  - condition: or
    conditions:
    - condition: state
      entity_id: light.example_02
      state: 'on'
    - condition: state
      entity_id: light.example_03
      state: 'on'
  then:
  - action: light.turn_off
    target:
      entity_id:
      - light.example_02
      - light.example_03
  else:
  - action: light.turn_on
    target:
      entity_id:
      - light.example_02
      - light.example_03
mode: queued
max: 10
alias: 'Light: on, off — trigger needs configuration · with branches'
description: Public template using light.turn_off, light.turn_on. Configure all placeholders
  and restore missing trigger or template details before use.
