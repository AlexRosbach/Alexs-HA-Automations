triggers:
- trigger: template
  value_template: '{{ states(''sensor.example_22'') | lower == ''bad'' }}'
  for: 00:03:00
conditions:
- condition: state
  entity_id: input_boolean.example_13
  state: 'on'
- condition: state
  entity_id: input_boolean.example_02
  state: 'off'
- condition: state
  entity_id: input_boolean.example_03
  state: 'off'
actions:
- action: light.turn_on
  target:
    entity_id: light.example_01
- wait_template: '{{ states(''sensor.example_22'') | lower not in [''bad'',''unknown'',''unavailable'',''not_home'',''none'','''']
    }}'
- condition: state
  entity_id: input_boolean.example_03
  state: 'off'
- action: light.turn_off
  target:
    entity_id: light.example_01
mode: single
max_exceeded: silent
alias: 'Light: on, off — template condition · with wait'
description: Public template using light.turn_off, light.turn_on. Configure all placeholders
  and restore missing trigger or template details before use.
