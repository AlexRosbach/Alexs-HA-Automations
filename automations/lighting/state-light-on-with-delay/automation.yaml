triggers:
- trigger: state
  entity_id: binary_sensor.example_22
  from: 'off'
  to: 'on'
conditions:
- condition: state
  entity_id: sun.example_01
  state: below_horizon
- condition: state
  entity_id: light.example_17
  state: 'on'
actions:
- action: light.turn_on
  target:
    entity_id: light.example_17
  data:
    brightness_pct: 5
- if:
  - condition: state
    entity_id: input_boolean.example_12
    state: 'off'
  then:
  - action: switch.turn_on
    target:
      entity_id: switch.example_14
  - delay:
      minutes: 5
  - if:
    - condition: state
      entity_id: input_boolean.example_12
      state: 'off'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.example_14
mode: restart
alias: 'Light: on — state change · with delay'
description: Public template using light.turn_on, switch.turn_off, switch.turn_on.
  Configure all placeholders and restore missing trigger or template details before
  use.
