triggers:
- trigger: state
  entity_id: binary_sensor.example_31
  from: 'off'
  to: 'on'
  for:
    minutes: 1
  id: IDENTIFIER_123
- trigger: state
  entity_id: binary_sensor.example_31
  to: 'off'
  for:
    minutes: 5
  id: IDENTIFIER_124
conditions:
- condition: state
  entity_id: input_boolean.example_03
  state: 'off'
actions:
- choose:
  - conditions:
    - condition: trigger
      id: IDENTIFIER_123
    sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.example_03
    - action: light.turn_on
      target:
        entity_id: light.example_01
  - conditions:
    - condition: trigger
      id: IDENTIFIER_124
    sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.example_03
    - if:
      - condition: template
        value_template: '{{ state_attr(''automation.example_04'', ''current'') | int(0)
          == 0 }}'
      then:
      - action: light.turn_off
        target:
          entity_id: light.example_01
mode: single
max_exceeded: silent
alias: 'Light: on, off — state change · with branches (6ba1b551)'
description: Public template using light.turn_off, light.turn_on, switch.turn_off,
  switch.turn_on. Configure all placeholders and restore missing trigger or template
  details before use.
